<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="ZsFocus">
  <title>ZsFocus — Z 求真 · s 求识</title>
  <desc>Z 用直角（甄别、去伪存真），s 用曲线（求索、尚未抵达）；瓦形底取自「甄」的部首「瓦」。</desc>
  <defs>
    <linearGradient id="zsf" x1="14%" y1="0%" x2="86%" y2="100%">
      <stop offset="0%" stop-color="#ffa961"/>
      <stop offset="52%" stop-color="#ff7a4d"/>
      <stop offset="100%" stop-color="#ff5468"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="23" fill="url(#zsf)"/>
  <path d="M 21 25 H 71 L 21 71 H 71" fill="none" stroke="#ffffff" stroke-width="11.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 77 41 C 63 41 61 53 69 54 C 77 55 77 69 63 71" fill="none" stroke="#ffd9c6"
        stroke-width="5.2" stroke-linecap="round"/>
</svg>

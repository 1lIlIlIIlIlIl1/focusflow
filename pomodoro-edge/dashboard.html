<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>ZsFocus · 专注报告</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
</head>
<body>
  <div class="shell">
    <header class="appbar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="zsBrandDash" x1="14%" y1="0%" x2="86%" y2="100%">
              <stop offset="0%" stop-color="#ffa961" />
              <stop offset="52%" stop-color="#ff7a4d" />
              <stop offset="100%" stop-color="#ff5468" />
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="23" fill="url(#zsBrandDash)" />
          <path
            d="M 21 25 H 71 L 21 71 H 71"
            fill="none"
            stroke="#fff"
            stroke-width="11.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M 77 41 C 63 41 61 53 69 54 C 77 55 77 69 63 71"
            fill="none"
            stroke="#ffd9c6"
            stroke-width="5.2"
            stroke-linecap="round"
          />
        </svg>
        <span>ZsFocus</span>
      </div>

      <nav class="tabs" id="tabs">
        <button data-tab="report" class="active">专注报告</button>
        <button data-tab="settings">设置</button>
      </nav>

      <div class="range" id="range">
        <button data-range="today" class="active">今日</button>
        <button data-range="week">本周</button>
        <button data-range="month">本月</button>
        <button data-range="all">全部</button>
      </div>
    </header>

    <!-- ========== 报告 ========== -->
    <main id="viewReport">
      <section class="summary" id="summary">
        <div class="stat-card">
          <div class="stat-label">总专注时长</div>
          <div class="stat-value num" id="statTotal">0<span class="unit">分钟</span></div>
          <div class="stat-sub" id="statTotalSub">共 0 个番茄</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">日均专注</div>
          <div class="stat-value num" id="statAvg">0<span class="unit">分钟</span></div>
          <div class="stat-sub" id="statAvgSub">按范围天数平均</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">连续打卡</div>
          <div class="stat-value num" id="statStreak">0<span class="unit">天</span></div>
          <div class="stat-sub">有专注记录即算一天</div>
        </div>
        <div class="stat-card goal-card">
          <div class="stat-label">今日目标</div>
          <div class="goal-line">
            <div class="stat-value num" id="statGoal">0<span class="unit">%</span></div>
            <div class="goal-bar"><span id="goalFill"></span></div>
          </div>
          <div class="stat-sub" id="statGoalSub">目标 120 分钟</div>
        </div>
      </section>

      <div class="grid grid-2">
        <section class="card">
          <div class="card-head">
            <h2>用途分布</h2>
            <span class="card-hint" id="donutHint"></span>
          </div>
          <div class="donut-wrap">
            <div class="donut" id="donut"></div>
            <div class="legend" id="legend"></div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 id="trendTitle">专注趋势</h2>
            <span class="card-hint" id="trendHint"></span>
          </div>
          <div class="chart" id="trendChart"></div>
        </section>
      </div>

      <div class="grid grid-2">
        <section class="card">
          <div class="card-head">
            <h2>各用途明细</h2>
          </div>
          <div class="detail-list" id="detailList"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>时段分布</h2>
            <span class="card-hint">按开始时间统计</span>
          </div>
          <div class="chart chart-sm" id="hourChart"></div>
        </section>
      </div>

      <section class="card">
        <div class="card-head">
          <h2>最近记录</h2>
          <button class="text-btn" id="btnExport">导出 CSV</button>
        </div>
        <div class="records" id="records"></div>
      </section>
    </main>

    <!-- ========== 设置 ========== -->
    <main id="viewSettings" hidden>
      <section class="card">
        <div class="card-head"><h2>计时时长</h2></div>
        <div class="form">
          <label class="field">
            <span>专注时长<em>分钟</em></span>
            <input type="number" id="setFocus" min="1" max="180" step="1" />
          </label>
          <label class="field">
            <span>短休息<em>分钟</em></span>
            <input type="number" id="setShort" min="1" max="60" step="1" />
          </label>
          <label class="field">
            <span>长休息<em>分钟</em></span>
            <input type="number" id="setLong" min="1" max="90" step="1" />
          </label>
          <label class="field">
            <span>几个番茄后长休息<em>个</em></span>
            <input type="number" id="setRounds" min="1" max="12" step="1" />
          </label>
          <label class="field">
            <span>每日目标<em>分钟</em></span>
            <input type="number" id="setGoal" min="10" max="900" step="10" />
          </label>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>自动化</h2></div>
        <div class="toggles">
          <label class="toggle-row">
            <span>专注结束自动开始休息</span>
            <input type="checkbox" id="setAutoBreak" class="switch" />
          </label>
          <label class="toggle-row">
            <span>休息结束自动开始下一轮</span>
            <input type="checkbox" id="setAutoFocus" class="switch" />
          </label>
          <label class="toggle-row">
            <span>结束提示音</span>
            <input type="checkbox" id="setSound" class="switch" />
          </label>
          <label class="toggle-row">
            <span>桌面通知</span>
            <input type="checkbox" id="setNotify" class="switch" />
          </label>
          <label class="toggle-row">
            <span>专注开始时自动播放氛围音</span>
            <input type="checkbox" id="setMusicAuto" class="switch" />
          </label>
        </div>
        <div class="row-actions">
          <button class="btn-ghost" id="btnTestSound">试听提示音</button>
          <button class="btn-ghost" id="btnTestNotify">测试通知</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>专注用途</h2>
          <button class="text-btn" id="btnAddType">新增用途</button>
        </div>
        <div class="type-editor" id="typeEditor"></div>
        <p class="hint">删除用途不会影响已产生的历史记录，历史会保留原来的名称与颜色。</p>
      </section>

      <section class="card">
        <div class="card-head"><h2>数据</h2></div>
        <div class="row-actions">
          <button class="btn-ghost" id="btnExport2">导出全部记录 CSV</button>
          <button class="btn-danger" id="btnClear">清空全部记录</button>
        </div>
        <p class="hint">所有数据只保存在这台电脑的浏览器里，不会上传到任何服务器。</p>
      </section>

      <div class="save-toast" id="saveToast">已保存</div>
    </main>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
